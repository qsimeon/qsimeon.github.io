# qsimeon.github.io: built by GitHub Pages (classic, `github-pages` gem → Jekyll 3.10).
# Only GitHub Pages–whitelisted plugins work in production; keep this list in sync with the Gemfile.

title: Quilee Simeon
tagline: Applied Scientist at Amazon FAI
description: >-
  Applied Scientist at Amazon FAI (formerly Amazon AGI) working on evaluation and expert-data quality
  for frontier language models. Previously computational neuroscience research at MIT and LLM
  efficiency research at Numenta.
url: https://qsimeon.github.io
baseurl: ""
repository: qsimeon/qsimeon.github.io
lang: en_US
timezone: America/New_York

author:
  name: Quilee Simeon
  email: quilee.simeon@icloud.com
  location: Boston, MA
  github: qsimeon
  linkedin: https://www.linkedin.com/in/quilee-simeon-7843a3178
  scholar: https://scholar.google.com/citations?user=vso4b9AAAAAJ&hl=en
  orcid: https://orcid.org/0000-0003-4561-5087
  x: https://x.com/qsimeon98
  substack: https://quilee.substack.com
  twitter: qsimeon98

# jekyll-seo-tag
logo: /images/portrait.jpg
twitter:
  username: qsimeon98
  card: summary_large_image
social:
  name: Quilee Simeon
  links:
    - https://github.com/qsimeon
    - https://www.linkedin.com/in/quilee-simeon-7843a3178
    - https://scholar.google.com/citations?user=vso4b9AAAAAJ
    - https://orcid.org/0000-0003-4561-5087
    - https://x.com/qsimeon98

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
excerpt_separator: "\n\n"
future: true
permalink: /:categories/:title/

include:
  - _pages
  - files
exclude:
  - README.md
  - STATUS.md
  - LICENSE
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .playwright-mcp

collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# `section` drives the active nav item (see _includes/header.html)
defaults:
  - scope: { path: "" }
    values:
      image: /images/og.png
  - scope: { path: "", type: posts }
    values: { layout: post, section: writing }
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: publications }
    values: { layout: entry, section: about }
  - scope: { path: "", type: talks }
    values: { layout: entry, section: about }
  - scope: { path: "", type: portfolio }
    values: { layout: entry, section: work }
